[core]

# inherit from the columnflow configuration file
inherit: $CF_BASE/law.cfg


[modules]

columnflow.tasks.cms.inference
columnflow.tasks.cms.external
MSSM_H_tt.tasks

[logging]

law: INFO
luigi-interface: INFO
gfal2: WARNING
columnflow.columnar_util-perf: INFO


[analysis]

default_analysis: MSSM_H_tt.config.analysis_MSSM_H_tt_skim_2025_v1.analysis_MSSM_H_tt_skim_2025_v1
default_config: config_run3_skim_2025_v1
default_dataset: DYto2L_M_50_0J_amcatnloFXFX

calibration_modules: columnflow.calibration.cms.{jets,met}, MSSM_H_tt.calibration.main
selection_modules: columnflow.selection.cms.{json_filter, met_filters}, MSSM_H_tt.selection.main
production_modules: columnflow.production.{categories,normalization,processes}, columnflow.production.cms.{btag,electron,mc_weight,muon,pdf,pileup,scale,seeds}, MSSM_H_tt.production.main, MSSM_H_tt.production.bdt_card
hist_production_modules: MSSM_H_tt.histogramming.main
ml_modules: columnflow.ml, MSSM_H_tt.ml.example
inference_modules: columnflow.inference, MSSM_H_tt.inference.mssm
data_driven_modules: MSSM_H_tt.tasks.data_driven_methods
default_keep_reduced_events: True

# namespace of all columnflow tasks
cf_task_namespace: cf

# default sandbox for main tasks with standard packages for columnar processing
default_columnar_sandbox: bash::$CF_BASE/sandboxes/venv_columnar.sh

# wether or not the ensure_proxy decorator should be skipped, even if used by task's run methods
skip_ensure_proxy: False

# some remote workflow parameter defaults
htcondor_flavor: $CF_HTCONDOR_FLAVOR
htcondor_share_software: False
# fallback only
htcondor_memory: 4GB
htcondor_disk: 6GB
htcondor_runtime: 2h
slurm_flavor: $CF_SLURM_FLAVOR
slurm_partition: $CF_SLURM_PARTITION

# ChunkedIOHandler defaults
chunked_io_chunk_size: 100000
chunked_io_pool_size: 2
chunked_io_debug: False

# csv list of task families that inherit from ChunkedReaderMixin and whose output arrays should be
# checked (raising an exception) for non-finite values before saving them to disk
check_finite_output: cf.CalibrateEvents, cf.ProduceColumns

# csv list of task families that inherit from ChunkedReaderMixin and whose input columns should be
# checked (raising an exception) for overlaps between fields when created a merged input array
check_overlapping_inputs: None

# whether to log runtimes of array functions by default
log_array_function_runtime: False

[resources]

task_cf.CalibrateEvents: \
    parallel_jobs=60, \
    htcondor_memory=18GB, \
    htcondor_disk=6GB, \
    htcondor_runtime=2h

task_cf.SelectEvents: \
    parallel_jobs=60, \
    htcondor_memory=10GB, \
    htcondor_disk=8GB, \
    htcondor_runtime=2h

task_cf.ReduceEvents: \
    parallel_jobs=50, \
    htcondor_memory=10GB, \
    htcondor_disk=8GB, \
    htcondor_runtime=2h

task_cf.ProduceColumns: \
    parallel_jobs=40, \
    htcondor_memory=12GB, \
    htcondor_disk=6GB, \
    htcondor_runtime=3h

task_cf.CreateHistograms: \
    parallel_jobs=60, \
    htcondor_memory=4GB, \
    htcondor_disk=5GB, \
    htcondor_runtime=3h

task_cf.MergeHistograms: \
    parallel_jobs=50, \
    htcondor_memory=4GB, \
    htcondor_disk=4GB, \
    htcondor_runtime=2h

task_cf.MergeShiftedHistograms: \
    parallel_jobs=50, \
    htcondor_memory=4GB, \
    htcondor_disk=4GB, \
    htcondor_runtime=2h

# [luigi_cf.MergeHistograms]

# remove_previous: True

[outputs]

# list of all used file systems
wlcg_file_systems: local, local_fs, wlcg_fs_infn_redirector, wlcg_fs_global_redirector

# list of file systems used by columnflow.tasks.external.GetDatasetLFNs.iter_nano_files to
# look for the correct fs per nano input file (in that order)
lfn_sources: wlcg_fs_infn_redirector, wlcg_fs_global_redirector

# output locations per task family
# for local targets : "local[, LOCAL_FS_NAME or STORE_PATH]"
# for remote targets: "wlcg[, WLCG_FS_NAME]"
# (when WLCG_FS_NAME is empty, the tasks' "default_wlcg_fs" attribute is used)
# examples:
# examples: f.CreateCutflowHistograms:     wlcg, wlcg_fs_desy_jmalvaso

task_cf.BundleRepo: wlcg, wlcg_fs_desytau_eos
task_cf.BundleSoftware: wlcg, wlcg_fs_desytau_eos
task_cf.BundleBashSandbox: wlcg, wlcg_fs_desytau_eos
task_cf.BundleCMSSWSandbox: wlcg, wlcg_fs_desytau_eos
task_cf.BundleExternalFiles: wlcg, wlcg_fs_desytau_eos
task_cf.GetDatasetLFNs: wlcg, wlcg_fs_desytau_eos
task_cf.CalibrateEvents: wlcg, wlcg_fs_desytau_eos
task_cf.SelectEvents: wlcg, wlcg_fs_desytau_eos
task_cf.MergeSelectionStats: wlcg, wlcg_fs_desytau_eos
task_cf.MergeSelectionMasks: wlcg, wlcg_fs_desytau_eos
task_cf.ReduceEvents: wlcg, wlcg_fs_desytau_eos
task_cf.MergeReductionStats: wlcg, wlcg_fs_desytau_eos
task_cf.MergeReducedEvents: wlcg, wlcg_fs_desytau_eos
task_cf.ProduceColumns: wlcg, wlcg_fs_desytau_eos

# task_cf.CreateHistograms : local, local_fs_dust_jmalvaso
# task_cf.MergeHistograms : local, local_fs_dust_jmalvaso
# task_cf.MergeShiftedHistograms : local, local_fs_dust_jmalvaso
# task_cf.PlotShiftedVariables1D : local, local_fs_dust_jmalvaso
# task_cf.PlotShiftedVariablesPerShift1D : local, local_fs_dust_jmalvaso
# task_cf.PlotVariables1D : local, local_fs_dust_jmalvaso
# task_cf.CreatePileupWeights: local, local_fs_dust_jmalvaso
# task_cf.PrepareMLEvents: local, local_fs_dust_jmalvaso
# task_cf.MergeMLEvents: local, local_fs_dust_jmalvaso
# task_cf.MLTraining: local, local_fs_dust_jmalvaso
# task_cf.MLEvaluation: local, local_fs_dust_jmalvaso
# task_cf.UniteColumns: local, local_fs_dust_jmalvaso
# task_cf.CreateBTagEfficiencyMaps: local, local_fs_dust_jmalvaso
# task_cf.CreateDatacards: local, local_fs_dust_jmalvaso

task_cf.CreateHistograms : wlcg, wlcg_fs_desytau_eos
task_cf.MergeHistograms : wlcg, wlcg_fs_desytau_eos
task_cf.MergeShiftedHistograms : wlcg, wlcg_fs_desytau_eos
task_cf.PlotShiftedVariables1D : wlcg, wlcg_fs_desytau_eos
task_cf.PlotShiftedVariablesPerShift1D : wlcg, wlcg_fs_desytau_eos
task_cf.PlotVariables1D : wlcg, wlcg_fs_desytau_eos
task_cf.CreatePileupWeights: wlcg, wlcg_fs_desytau_eos
task_cf.PrepareMLEvents: wlcg, wlcg_fs_desytau_eos
task_cf.MergeMLEvents: wlcg, wlcg_fs_desytau_eos
task_cf.MLTraining: wlcg, wlcg_fs_desytau_eos
task_cf.MLEvaluation: wlcg, wlcg_fs_desytau_eos
task_cf.UniteColumns: wlcg, wlcg_fs_desytau_eos
task_cf.CreateBTagEfficiencyMaps: wlcg, wlcg_fs_desytau_eos
task_cf.CreateDatacards: wlcg, wlcg_fs_desytau_eos

[job]

job_file_dir: $CF_JOB_BASE
job_file_dir_cleanup: True
job_file_dir_mkdtemp: sub_{{task_id}}_XXX

# storage element (SE) and output directory on that SE for crab's internal output
# (crab might not even move files there, but it is strictly required for crab's job submission)
crab_storage_element: $CF_CRAB_STORAGE_ELEMENT
crab_base_directory: $CF_CRAB_BASE_DIRECTORY

# lcg setup file sourced in remote jobs to access gfal tools
remote_lcg_setup_el9: /cvmfs/grid.cern.ch/alma9-ui-test/etc/profile.d/setup-alma9-test.sh

# whether the loading of the remove lcg setup file is enforced
# otherwise is might be skipped in case gfal-ls, etc., are already available
remote_lcg_setup_force: True

# Keep job queries very small. This is important when law asks for job status.
htcondor_chunk_size_query: 1

# Replace law's default schedd-history query by a wrapper that first tries
# condor_history -userlog <HTCondor event log>.
htcondor_cmd_history: /afs/cern.ch/user/j/jmalvaso/CPinHToTauTau/scripts/condor_history_userlog_wrapper.sh

[local]

#base: root://eosuser.cern.ch
base: /
[local_fs]

base: /

[wlcg_fs_eos]

